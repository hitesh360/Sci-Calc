name: Deploy to GitHub Pages

# Trigger: push to main branch OR manual "Run workflow" button in Actions tab
on:
  push:
    branches: [main]
  workflow_dispatch:

# Required permissions: write access to push the gh-pages branch
permissions:
  contents: write

# Only one concurrent deployment at a time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Set up Node.js 20 with npm cache
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Install dependencies (respects package-lock.json exactly)
      - name: Install dependencies
        run: npm ci

      # 4. Build the Vite app (outputs to /dist)
      - name: Build
        run: npm run build

      # 5. Deploy the built /dist folder to the gh-pages branch
      #    GitHub Pages must be configured to deploy from the gh-pages branch
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
